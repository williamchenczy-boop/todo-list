7969 L1076,425.7969 L1086,425.7969 L1076,415.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323" x="698" y="432.8638">UI and persistence are outside this entity diagram.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341" x="698" y="447.9966">Auto-save is an application/persistence responsibility.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343" x="698" y="463.1294">Indexes refer to the current full list. A future filtered UI</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373" x="698" y="478.2622">must map its selected task back to that list before editing.</text></g><polygon fill="#181818" points="508.1053,260.4558,500.9473,261.3295,499.0007,268.2729,506.1587,267.3992,508.1053,260.4558" style="stroke:#181818;stroke-width:1.0;"/><path d="M499.0007,268.2729 C479.0713,285.3843 467.2686,295.5182 446.5932,313.2701 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54" x="481" y="291.3638">contains</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="23" x="422.5932" y="309.337">0..*</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8" x="499.1053" y="273.5227">1</text><polygon fill="#181818" points="287,625.903,291,616.903,287,620.903,283,616.903,287,625.903" style="stroke:#181818;stroke-width:1.0;"/><path d="M287,589.4254 C287,602.3468 287,608.7595 287,619.903 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="630,402.7912,634,393.7912,630,397.7912,626,393.7912,630,402.7912" style="stroke:#181818;stroke-width:1.0;"/><path d="M630,260.4558 C630,309.0621 630,35